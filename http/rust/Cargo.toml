[package]
name = "showkeyboard_server"
version = "1.56.0"
edition = "2021"
description = "ShowKeyBoard HTTP and WebSocket server"

[dependencies]
# Web framework
axum = { version = "0.7", features = ["ws", "multipart"] }
tokio = { version = "1", features = ["full"] }
tower = "0.4"
tower-http = { version = "0.5", features = ["fs", "cors"] }

# WebSocket
tokio-tungstenite = "0.21"
futures-util = "0.3"

# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Database
rusqlite = { version = "0.31", features = ["bundled"] }

# Utilities
chrono = { version = "0.4", features = ["serde"] }
uuid = { version = "1.0", features = ["v4"] }
zip = "2.1"
log = "0.4"
env_logger = "0.11"

[profile.release]
opt-level = 3
lto = true
