[package]
name = "showkeyboard-client"
version = "1.61.0"
edition = "2021"
description = "ShowKeyBoard client rewritten in Rust (Slint UI)"
build = "build.rs"

[dependencies]
# 关闭默认特性：不需要 accessibility(无障碍树)/system-tray(内置托盘)/compat-1-2，
# 可显著降低常驻内存与二进制体积；保留 renderer-software 便于用
# SLINT_BACKEND=winit-software 做对比测试
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    # 允许在创建窗口前调整 winit WindowAttributes（隐藏任务栏按钮 / 设置 owner）
    "unstable-winit-030",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", features = ["json"] }
tungstenite = "0.24"
encoding_rs = "0.8"
regex = "1"
libloading = "0.8"
crossbeam-channel = "0.5"
tray-icon = "0.19"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

[profile.release]
lto = true
strip = true
