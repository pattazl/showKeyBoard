[package]
name = "showkeyboard"
version = "2.6.0"
edition = "2021"
description = "ShowKeyBoard client rewritten in Rust (Slint UI)"
build = "build.rs"

[dependencies]
# 关闭默认特性：不需要 accessibility(无障碍树)/system-tray(内置托盘)/compat-1-2，
# 可显著降低常驻内存与二进制体积；保留 renderer-software 便于用
# SLINT_BACKEND=winit-software 做对比测试
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    # 允许在创建窗口前调整 winit WindowAttributes（隐藏任务栏按钮 / 设置 owner）
    "unstable-winit-030",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
encoding_rs = "0.8"
regex = "1"
crossbeam-channel = "0.5"
tray-icon = "0.24"

# 内嵌 HTTP/WS 服务端（原 showkeyboard_server 功能迁入客户端进程）
axum = { version = "0.7", features = ["ws", "multipart"] }
# 只启用实际用到的 tokio 能力（full 会额外引入 process/signal/io-std 等）
tokio = { version = "1", features = [
    "rt", "rt-multi-thread", "macros", "net", "time", "sync", "fs", "io-util",
] }
tower-http = { version = "0.5", features = ["fs", "cors"] }
futures-util = "0.3"
rusqlite = { version = "0.31", features = ["bundled"] }
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
# 仅读写 Deflate 压缩的 zip（默认特性会引入 bzip2/lzma/zstd 等整套压缩库）
zip = { version = "2.1", default-features = false, features = ["deflate"] }
log = "0.4"
# 日志输出到 stderr/文件，无需彩色与正则过滤
env_logger = { version = "0.11", default-features = false, features = ["humantime"] }
local-ip-address = "0.6"
hostname = "0.4"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_Memory",
    "Win32_System_Kernel",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 输入捕获：CGEventTap（精简版 rdev 已内联到 src/input/rdev/，需在"辅助功能"里授权）
# cocoa 仅用于 listen 的 NSAutoreleasePool / nil（原 rdev 同款依赖）
cocoa = "0.22"
# 读取 NSWorkspace.frontmostApplication（前台应用 PID）
objc = "0.2"
# macOS 手柄：IOKit HID（对应 Windows 的 XInput / winmm）
gilrs = "0.11"
core-foundation = "0.10"
core-graphics = "0.24"
libc = "0.2"

[profile.release]
# 以体积优先：体积优化、单代码单元、省略栈回溯（panic 直接 abort）
opt-level = "z"
lto = true
codegen-units = 1
panic = "abort"
strip = true

[lints.rust]
# objc 0.2 的 msg_send!/class! 宏内部使用 #[cfg(feature = "cargo-clippy")]，
# 新版 rustc 的 unexpected_cfgs 会在本 crate 展开宏时报 warning。
# 声明该 cfg 取值后即可消除（不影响其它 lint）。
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(feature, values("cargo-clippy"))'] }
