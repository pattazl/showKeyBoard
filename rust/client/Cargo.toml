[package]
name = "showkeyboard_client"
version = "2.0.0"
edition = "2021"
description = "ShowKeyBoard client rewritten in Rust (Slint UI)"
build = "build.rs"

[dependencies]
# 关闭默认特性：不需要 accessibility(无障碍树)/system-tray(内置托盘)/compat-1-2，
# 可显著降低常驻内存与二进制体积；保留 renderer-software 便于用
# SLINT_BACKEND=winit-software 做对比测试
slint = { version = "1.18", default-features = false, features = [
    "std",
    "backend-winit",
    "renderer-femtovg",
    "renderer-software",
    "compat-1-2",
    # 允许在创建窗口前调整 winit WindowAttributes（隐藏任务栏按钮 / 设置 owner）
    "unstable-winit-030",
] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ureq = { version = "2", default-features = false, features = ["json", "native-tls"] }
tungstenite = { version = "0.24", default-features = false, features = ["handshake", "native-tls"] }
encoding_rs = "0.8"
regex = "1"
crossbeam-channel = "0.5"
tray-icon = "0.19"

[build-dependencies]
slint-build = "1.8"

[target.'cfg(windows)'.dependencies]
libloading = "0.8"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_Threading",
    "Win32_System_LibraryLoader",
    "Win32_System_Registry",
    "Win32_System_SystemInformation",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Diagnostics_Debug",
    "Win32_Security",
    "Win32_Graphics_Gdi",
    "Win32_UI_Shell",
    "Win32_UI_HiDpi",
] }

[target.'cfg(target_os = "macos")'.dependencies]
# macOS 输入捕获：CGEventTap（需在"辅助功能"里授权）
rdev = "0.5"
# macOS 手柄：IOKit HID（对应 Windows 的 XInput / winmm）
gilrs = "0.11"
core-foundation = "0.10"
core-graphics = "0.24"
libc = "0.2"

[profile.release]
lto = true
strip = true
